name: changelog
# This fires only when we push to the `development` branch.
on:
  push:
    branches: [ development ]

jobs:
  build:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1
        with:
          fetch-depth: 0
      

      - name: Generate Changelog
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.12'
      - run: python ~/work/UniversalisAPI_wrapper/UniversalisAPI_wrapper/.github/scripts/gen_changelog.py $$ 